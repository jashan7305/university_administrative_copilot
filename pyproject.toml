[project]
name = "university-administrative-copilot"
version = "0.2.0"
description = "NLP copilot for NMIMS administrative queries: dataset pipeline, NLP components and FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "nltk>=3.10.3",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sklearn-crfsuite>=0.5.0",
    "rank-bm25>=0.2.2",
    "seqeval>=1.2.2",
    "pyyaml>=6.0.3",
    # dataset phase 1 (collection / extraction / OCR)
    "trafilatura>=2.3",
    "pypdf>=6.0",
    "pymupdf>=1.28",
    "rapidocr-onnxruntime>=1.2",
    "rouge-score>=0.1.2",
    "python-docx>=1.2.0",
    "datasets>=5.1.0",
    "accelerate>=1.15.0",
]

[project.optional-dependencies]
llm = ["anthropic"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/nlp", "src/dataset"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
