# Elective advisor evaluation cases, labelled by hand from the published MPSTME programme structures (SRC052),
# the CBCS rules (SRB p. 14) and the syllabi in data/electives/syllabi/.
#   split: dev       - scenarios looked at while the advisor was built (expect these to pass)
#          heldout   - written from the rules before the advisor was run on them
#   expect: per-syllabus status (file stem) -> eligible | not_recommended | needs_review | not_eligible
#   recommend: file stem of the expected recommendation (null = none should be recommended; omitted = not scored)
#   program / semesters: expected profile parse
cases:
  # ------------------------------------------------------------------ dev
  - id: D01
    split: dev
    topic: artificial_intelligence
    identity: third year student, computer science program
    program: B Tech Computer Science
    semesters: [5, 6]
    expect: {NEW_generative_ai_and_llm_applications: eligible, deep_learning: eligible,
             introduction_to_machine_learning_open: not_recommended, natural_language_processing: not_eligible,
             reinforcement_learning: not_eligible}
    recommend: NEW_generative_ai_and_llm_applications
