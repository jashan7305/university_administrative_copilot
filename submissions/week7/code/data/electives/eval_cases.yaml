# Expected parse of each syllabus (fields the advisor needs).
syllabi:
  natural_language_processing: {course_type: program_elective, programs: [B Tech Computer Engineering, B Tech Information Technology], semesters: [6], prerequisites: [Machine Learning, Probability and Statistics]}
  deep_learning: {course_type: program_elective, programs: [B Tech Computer Science, B Tech Computer Engineering, B Tech Information Technology, B Tech Computer Science and Business Systems], semesters: [5], prerequisites: [Machine Learning, Linear Algebra]}
  introduction_to_machine_learning_open: {course_type: open_elective, open_to_all: UG, semesters: [5], prerequisites: [Probability and Statistics]}
  reinforcement_learning: {course_type: program_elective, programs: [B Tech Artificial Intelligence, B Tech Computer Science], semesters: [7], prerequisites: [Deep Learning, Probability and Statistics]}
  NEW_generative_ai_and_llm_applications: {course_type: program_elective, programs: [B Tech Computer Science, B Tech Computer Engineering, B Tech Artificial Intelligence], semesters: [6], prerequisites: [Machine Learning, Data Structures and Algorithms]}
  network_security: {course_type: program_elective, programs: [B Tech Computer Science, B Tech Computer Engineering, B Tech Information Technology], semesters: [6], prerequisites: [Computer Networks]}
  applied_cryptography: {course_type: program_elective, programs: [B Tech Computer Science, B Tech Computer Engineering], semesters: [5], prerequisites: [Discrete Mathematics]}
  ethical_hacking: {course_type: program_elective, programs: [B Tech Computer Science and Engineering (Cybersecurity), B Tech Information Technology], semesters: [7], prerequisites: [Network Security]}
  cyber_hygiene_open: {course_type: open_elective, open_to_all: UG, semesters: [6], prerequisites: []}
  NEW_cloud_security_engineering: {course_type: program_elective, programs: [B Tech Computer Science, B Tech Computer Engineering, B Tech Information Technology], semesters: [7], prerequisites: [Computer Networks, Operating Systems]}
  financial_management_open: {course_type: open_elective, open_to_all: UG, semesters: [5], prerequisites: [Principles of Economics and Management]}
  entrepreneurship_open: {course_type: open_elective, open_to_all: UG, semesters: [6], prerequisites: []}
  project_management_open: {course_type: open_elective, open_to_all: UG, semesters: [6], prerequisites: []}
  business_analytics_pg_open: {course_type: open_elective, open_to_all: PG, semesters: [2], prerequisites: []}
  NEW_sustainable_engineering_esg: {course_type: open_elective, open_to_all: UG, semesters: [5, 6], prerequisites: []}
