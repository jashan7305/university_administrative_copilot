# Verified facts extracted from official NMIMS sources (see data/final/source_inventory.csv).
# Each fact paraphrases one passage; `quote` is copied verbatim from data/interim/extracted/<source>.txt and is
# checked automatically by phase 4. `department` is the raw wording; config.RAW_DEPARTMENT maps it to a canonical
# routing department. `documents` lists only documents the passage itself names.
next_action_by_sub_intent:
  BONAFIDE_CERTIFICATE: Check the current process with the school academic office; the portal listing of bonafide certificates is from the 2024-25 SRB
  PROVISIONAL_DEGREE: Write to the examination department with the purpose and your programme, student number, roll number, batch and contact details
  DEGREE_CERTIFICATE: Clear all dues, submit the migration certificate and pass all examinations to be eligible for the degree
  DUPLICATE_DEGREE: Submit the duplicate/correction form with the indemnity bond to the school examination office and pay the fee online
  CERTIFICATE_CORRECTION: Get the name corrected in university records through the Admission Department, then surrender the original to the school examination office
  CLEARANCE_CERTIFICATE: Submit a written application with your reason for leaving and get sign-off from the listed departments
  MIGRATION_CERTIFICATE: Submit the migration certificate application with the final-year mark sheet and degree certificate and pay the fee by RTGS/NEFT
  EDUCATION_VERIFICATION: The verifying company or institute emails edu.verification@nmims.edu with the documents and pays the verification fee
  LETTER_OF_RECOMMENDATION: Request the LOR through the student services section of the student portal
  ACADEMIC_DOCUMENTS: Submit all documents listed in the offer letter to the admission department before the deadline
  DIGILOCKER: Access your final certificates through the DigiLocker app (National Academic Depository)
  TRANSCRIPT: Apply online at nmims.edu/application-for-e-transcript-delivery and upload your degree certificate and all grade sheets in one PDF
  STATEMENT_OF_MARKS: Collect the annual grade sheet; request a statement of marks online if you need marks and percentage
  PERCENTAGE_LETTER: Apply online at nmims.edu/statement-of-marks-percentage-letter with all grade sheets and the degree certificate in one PDF
  GPA_CGPA_LETTER: Submit a written application stating the purpose of the GPA/CGPA letter with your student details
  DUPLICATE_GRADE_SHEET: Fill the duplicate/correction form, attach the indemnity bond and submit it through the school examination office
  WES: Use the NMIMS electronic WES process; do not post or courier documents to WES yourself
  EXAM_TIMETABLE: Check the timetable on the student portal and nmims.edu/examination about 30-45 days before exams
  EXAM_ELIGIBILITY: Make sure you have at least 80% attendance in each course and carry your ID card to the exam
  EXAM_RESULT: Check your result and ICA marks on the student portal and raise discrepancies within the stated days
  RE_EXAMINATION: Apply for the re-exam on the SAP student portal within the 3-day window and pay Rs. 1,000 per subject
  REVALUATION: Apply for the answer-book photocopy first, then revaluation on the SAP portal within 3 days of the result, citing specific questions and reasons
  MARK_VERIFICATION: Apply for verification of marks on the SAP portal grievance screen within 3 days of the result
  ANSWER_BOOK_COPY: Apply for the answer-book soft copy on the SAP portal within 2 days of the result and download it
  EXAM_GRIEVANCE: Use the grievance redressal mechanism on the SAP portal; it covers term-end exams only
  SCRIBE_WRITER: Submit the scribe application (Annexure 6) with a stamped medical certificate to the Controller of Examinations 7 days before the exam
  EXAM_MISCONDUCT: Follow examination hall rules; unfair-means cases go to the Unfair Means Inquiry Committee
  EXAM_ABSENCE: Appear in the re-examination for the course marked AB by applying on the SAP portal
  BACKLOG_EXAM: Check the promotion/ATKT rules in the SRB and apply for the re-examination of failed courses
  FEE_PAYMENT: Pay the fees as per the email from the Accounts department before the due date
  FEE_RECEIPT: Submit the duplicate fee receipt application (Annexure 7) with the Rs. 100 fee to Accounts
  LATE_FEE: Pay before the due date to avoid the late fee; unpaid fees after the late period cancel studentship
  FEE_REFUND: Submit the refund application with a cancelled cheque; refunds go to the bank account given
  EXCESS_FEE_REFUND: Submit the refund form (excess fee/deposit) with the original receipt and a cancelled cheque to Accounts
  ADMISSION_CANCELLATION: Apply online at nmims.edu/admission-cancellation and upload the signed form, fee receipt and cancelled cheque
  SCHOLARSHIP_ELIGIBILITY: Keep clear of F grades, misconduct and low attendance to stay eligible for awards
  SCHOLARSHIP_APPLICATION: Apply through the school academic office; national scholarships are applied for on the National Scholarship Portal
  ATTENDANCE_REQUIREMENT: Maintain at least 80% attendance in every course
  LOW_ATTENDANCE: Contact the course coordinator/AR/DR within 3 days of the attendance status; below 80% requires re-admission
  MEDICAL_ATTENDANCE: Submit a medical certificate and all medical reports to the office within 3 days of resuming classes
  ATTENDANCE_CORRECTION: Inform the faculty in writing immediately and report the discrepancy to the office within 3 days of publication
  ATTENDANCE_EXEMPTION: Check the current SRB; the 70-80% Dean exemption applied only up to AY 2024-25
  ATTENDANCE_APPEAL: Apply to the course coordinator (not the faculty), and write to the Dean/Director for final attendance issues
  ATTENDANCE_RECORD: Check monthly attendance on the student portal or notice board
  COURSE_REGISTRATION: Register for the course through the student portal during the notified registration window
  ELECTIVE_SELECTION: Route your elective choice through the course coordinator or programme chair, or choose open electives on the portal
  COURSE_CHANGE: Check eligibility in the SRB and apply through the admission department
  ACADEMIC_CALENDAR: Refer to the MPSTME academic calendar in the SRB; dates are subject to change
  ACADEMIC_GUIDELINES: Refer to the relevant section of the Student Resource Book or contact the course coordinator
  STUDENT_STATUS: Apply to the Dean/Director with supporting documents; re-admission fees apply
  ACADEMIC_BANK_OF_CREDITS: Credits are deposited and redeemed under the UGC Academic Bank of Credits Regulations, 2021
  ID_CARD_APPLICATION: Collect and wear the ID card issued by the school at all times on campus
  DUPLICATE_ID_CARD: Apply to the school for a duplicate ID card and pay the prescribed fee
  ID_CARD_ACCESS: Approach campus security to get access if you do not have your ID card
  ID_CARD_NOT_WORKING: Email biometricregistration@svkm.ac.in with your ID card issue
  HOSTEL_APPLICATION: Download the hostel form, fill it and email the PDF with your tuition fee receipt to hostel.mumbai@nmims.edu
  HOSTEL_ELIGIBILITY: Apply as a full-time student; out-station students get preference
  HOSTEL_DOCUMENTS: Attach residence proof, a medical certificate, medical insurance of Rs. 1 lakh and the tuition fee receipt to the hostel form
  HOSTEL_ALLOCATION: Wait for the approval email (within 3 working days) and take up the room by the stated date
  HOSTEL_FEES: Pay the hostel fee by RTGS/NEFT using the details in the approval email
  HOSTEL_RULES: Follow the hostel rules; get permission from the hostel in-charge or Registrar where required
  HOSTEL_VACATING: Vacate within 3 days of your last exam and clear all dues before leaving
  HOSTEL_REFUND: Get the hostel deposit receipt signed and submit the refund application with a cancelled cheque to Accounts
  HOSTEL_PROBLEMS: Report the issue to the Registrar / hostel office; do not attempt repairs yourself
  LIBRARY_TIMINGS: Visit during the listed library hours
  BOOK_BORROWING: Borrow at the library's RFID self-check kiosk with your ID card
  BOOK_RENEWAL: Renew once at the library if the book is not in demand, or reserve it through WebOPAC
  LIBRARY_FINE: Check dues in OPAC and pay the overdue fine to restore borrowing rights
  LOST_BOOK: Report the loss to the library and pay the replacement cost plus administrative charge
  DIGITAL_RESOURCES: Access e-resources through the library's remote access or the student portal
  LIBRARY_ACCESS: Carry your valid NMIMS ID card to enter the library
  LIBRARY_RULES: Follow library rules; contact the librarian for exceptions
  STUDENT_PORTAL: Log in at portal.svkm.ac.in with your SAP number; for help email portal_app_team@svkm.ac.in
  FACILITIES: Email ITHelpdesk@nmims.edu or record a written complaint in the Computer Lab register
  MEDICAL_FITNESS: Get the medical fitness certificate format filled by a doctor
  COUNSELLING: Contact your faculty mentor or the school counsellor
  STUDENT_ACTIVITIES: Route contest participation through the Faculty in charge of Student Activity/HOD/Dean and submit claims to the AR/DR
  STUDENT_COUNCIL: Contact your school's student council representatives
  PLACEMENT: Follow the Placement Office guidelines; submit the Opted Out Form if not participating
  INTERNATIONAL_EXCHANGE: Fill the student exchange application form with your CV and submit it through the school to International Linkages
  INTERNATIONAL_DOCUMENTS: Request the visa support letter from your school Dean and submit passport, visa, insurance and ticket copies
  STUDENT_GRIEVANCE: Raise it through the class representative and course coordinator; for academic grievances email grievance.academic@nmims.edu
  ANTI_RAGGING: Report to the Anti-Ragging Committee or call the National Anti-Ragging Helpline 1800-180-5522
  INTERNAL_COMPLAINTS: Report to the Internal Complaints Committee
  WOMEN_GRIEVANCE: Approach the Women Grievance Redressal Committee of your school or the university cell
  EQUAL_OPPORTUNITY: Approach the SC/ST/OBC & Equal Opportunity Cell committee
  SC_ST_SUPPORT: Approach the SC/ST/OBC & Equal Opportunity Cell committee
  STUDENT_SAFETY: Report security incidents to reportsecurityincidents@svkm.ac.in
  MENTAL_HEALTH_SUPPORT: Book a session with the campus psychologist by call or email; Tele-MANAS 14416 is available 24/7
facts:
- id: F0001
  source: SRC052
  page: 6
  sub_intent: ID_CARD_APPLICATION
  department: School administration
  fact: All students are provided an Identity Card, which must be worn; campus entry is strictly through the ID card.
  quote: All students are provided with an Identity Card, which they are required to wear mandatorily
- id: F0002
  source: SRC052
  page: 6
  sub_intent: DUPLICATE_ID_CARD
  department: School administration
  fact: If a student misplaces the original ID card, a duplicate ID card is issued by the school on payment of a prescribed fee.
  quote: a duplicate ID card will be issued by the school by paying a prescribed fee
- id: F0003
  source: SRC052
  page: 6
  sub_intent: ID_CARD_ACCESS
  department: Security
  fact: Biometric print plus ID card is mandatory, and flap barriers are used to enter and exit school premises where deployed.
  quote: Biometric Print plus ID card is a mandatory requirement
- id: F0004
  source: SRC052
  page: 6
  sub_intent: ID_CARD_ACCESS
  department: Security
  fact: A student who forgets the ID card should approach security and complete the process to get access.
  quote: In case a student forgets to carry an ID card, they should approach security
- id: F0005
  source: SRC052
  page: 6
  sub_intent: ID_CARD_NOT_WORKING
  department: Biometric registration (SVKM)
  fact: Grievances related to the ID card should be raised to biometricregistration@svkm.ac.in.
  quote: Any grievances related to the ID Card should be raised to biometricregistration@svkm.ac.in
- id: F0006
  source: SRC052
  page: 6
  sub_intent: ID_CARD_ACCESS
  department: School administration
  fact: Students must not use another student's ID card or let their own be used; both students face disciplinary action.
  quote: Students must not use another student's ID card
- id: F0007
  source: SRC052
  page: 5
  sub_intent: STUDENT_GRIEVANCE
  department: Course coordinator
  fact: Problems about administrative facilities, faculty or classrooms go through the class representative to the course coordinator; if unresolved, the student may write to the Assistant Registrar, Deputy Registrar, Dean/Director or Registrar.
  quote: must be addressed through the class representative, who will take it up with the course coordinator
- id: F0008
  source: SRC052
  page: 5
  sub_intent: STUDENT_PORTAL
  department: School administration
  fact: The student portal, email and notice board are the modes of communication with students, who should check them at least once a day.
  quote: The mode of Communication with students is via the Student Portal / email /Notice Board
- id: F0009
  source: SRC052
  page: 6
  sub_intent: ELECTIVE_SELECTION
  department: Course coordinator / Program chair
  fact: Students must not contact faculty directly about elective selection; options are routed through course coordinators or program chairs.
  quote: They must route their option through Course Co-ordinators or Program Chairs
- id: F0010
  source: SRC052
  page: 9
  sub_intent: ACADEMIC_GUIDELINES
  department: Dean / Director / HOD
  fact: Students must be in the city on all days of the term; leaving the city requires prior permission from the HOD, Director or Dean.
  quote: they are required to obtain prior permission from the HOD/Director/Dean
- id: F0011
  source: SRC052
  page: 11
  sub_intent: ATTENDANCE_REQUIREMENT
  department: Academic office
  fact: 100% attendance is expected, but up to 20% absence may be relaxed for valid reasons provided attendance does not drop below 80% in each course.
  quote: A maximum relaxation of up to 20% absence may be granted in such cases provided the overall attendance does not drop below 80% in each course
- id: F0012
  source: SRC052
  page: 11
  sub_intent: EXAM_ELIGIBILITY
  department: Examination department
  fact: Students with 80% or higher attendance in individual courses are eligible for the term-end examinations.
  quote: Students who have maintained 80% or higher attendance in individual courses
- id: F0013
  source: SRC052
  page: 11
  sub_intent: LOW_ATTENDANCE
  department: Academic office
  fact: Students below 80% in an individual course must take re-admission, either in the same term or for the full year in the next academic year.
  quote: Students will be required to take re-admission
- id: F0014
  source: SRC052
  page: 10
  sub_intent: ATTENDANCE_CORRECTION
  department: Academic office
  fact: Attendance is displayed monthly; any discrepancy must be reported to the office in writing within 3 days of publication, after which no claim is entertained.
  quote: he/she should inform the office in writing regarding the same within 3 days of the publication of the attendance record
- id: F0015
  source: SRC052
  page: 10
  sub_intent: ATTENDANCE_CORRECTION
  department: Concerned faculty
  fact: A student marked absent when present should immediately inform the faculty with a written application and keep a copy.
  quote: If the student is marked absent even when present, he/she should immediately inform the concerned faculty by submitting a written application
- id: F0016
  source: SRC052
  page: 10
  sub_intent: MEDICAL_ATTENDANCE
  department: Academic office
  fact: After medical absence, a medical certificate and all medical reports must be submitted to the office within 3 days of resuming classes.
  quote: he/she should submit a medical certificate along with a copy of all the medical reports to the office within 3 days of resuming classes
  documents:
  - Medical certificate
  - Copies of all medical reports
- id: F0017
  source: SRC052
  page: 10
  sub_intent: LOW_ATTENDANCE
  department: Academic office
  fact: Parents are informed by email/WhatsApp if the student's monthly attendance is below 80%.
  quote: Parents of the students shall be informed of the attendance record of their ward if the student has less than 80%
- id: F0018
  source: SRC052
  page: 10
  sub_intent: ATTENDANCE_APPEAL
  department: Course coordinator
  fact: Students must not approach faculty about attendance issues; they apply to the concerned coordinator.
  quote: They must apply to the concerned coordinator for necessary approvals
- id: F0019
  source: SRC052
  page: 10
  sub_intent: ATTENDANCE_APPEAL
  department: Dean / Director
  fact: Issues with final term attendance are notified in writing to the Dean/Director of the campus.
  quote: will notify the Dean/Director of the campus in writing
- id: F0020
  source: SRC052
  page: 10
  sub_intent: ATTENDANCE_RECORD
  department: Examination department
  fact: Students appearing for a re-examination are marked present for all applicable subjects on that day.
  quote: Students appearing for a re -examination shall be granted attendance in lieu of regular classes
- id: F0021
  source: SRC052
  page: 11
  sub_intent: ATTENDANCE_APPEAL
  department: Course coordinator / AR / DR
  fact: Attendance-related queries go to the school Course Co-ordinator, AR or DR within 3 days of receiving the attendance status.
  quote: Please contact the school Course Co-ordinator /AR/ DR for any attendance-related queries within 3 days
- id: F0022
  source: SRC052
  page: 13
  sub_intent: EXAM_RESULT
  department: Concerned faculty
  fact: ICA component marks are informed within seven days; discrepancies must be raised and resolved within two days of publication on the portal.
  quote: Any discrepancies in ICA marks should be informed and resolved within two days of publication on the portal
- id: F0023
  source: SRC052
  page: 13
  sub_intent: BACKLOG_EXAM
  department: Examination department
  fact: ONLY-ICA courses need 40% of total ICA marks to pass; there is no re-examination for them, and failing requires re-admission.
  quote: there will be no re -examination for Only ICA Courses
- id: F0024
  source: SRC052
  page: 13
  sub_intent: EXAM_RESULT
  department: Examination department
  fact: Grace marks are never awarded on the ICA component.
  quote: Grace Marks will never be awarded on the ICA (Internal Continuous Assessment)
- id: F0025
  source: SRC052
  page: 15
  sub_intent: STUDENT_GRIEVANCE
  department: Academic grievance cell
  fact: For any academic grievance, students may write to grievance.academic@nmims.edu.
  quote: For any academic grievance, the student may write to grievance.academic@nmims.edu
- id: F0026
  source: SRC052
  page: 14
  sub_intent: COURSE_REGISTRATION
  department: Home school
  fact: Interdisciplinary courses (Mumbai campus only) run in Fall and Winter sessions; students may choose at most 2, one per session, registering through the student portal.
  quote: The students have to register through the Students portal only
- id: F0027
  source: SRC052
  page: 14
  sub_intent: ELECTIVE_SELECTION
  department: Home school
  fact: 'CBCS (Mumbai campus only): first-year UG students are not eligible to opt CBCS courses.'
  quote: The UG students of 1st year and PG students of Term I of 1st year are not eligible to opt CBCS courses
- id: F0028
  source: SRC052
  page: 16
  sub_intent: EXAM_ELIGIBILITY
  department: Examination department
  fact: Students must carry their University ID card during exams; admission to the hall may be denied without it.
  quote: Admission to the examination hall may be denied if University identity card is not produced
- id: F0029
  source: SRC052
  page: 16
  sub_intent: EXAM_TIMETABLE
  department: Examination department
  fact: Students must be in the exam hall at least 30 minutes early; latecomers need written approval from the Dean/Director up to 30 minutes after start, and after 30 minutes they cannot write.
  quote: Students who report for the examination after 30 minutes of commencement of examination, will not be allowed to write examination under any circumstances
- id: F0030
  source: SRC052
  page: 16
  sub_intent: EXAM_ABSENCE
  department: Examination department
  fact: A student who misses an exam gets an 'Absent' remark; re-examination is per the rules and no special re-examination is held.
  quote: No special re examination will be conducted for such students
- id: F0031
  source: SRC052
  page: 16
  sub_intent: EXAM_MISCONDUCT
  department: Examination department
  fact: Mobile phones, smart watches, earbuds, programmable or financial calculators, AI glasses and similar devices are forbidden in the exam hall unless specifically permitted.
  quote: storable/programmable or financial calculators
- id: F0032
  source: SRC052
  page: 17
  sub_intent: EXAM_MISCONDUCT
  department: Examination department
  fact: Term-end answer books are QR coded; writing name, roll number or student number in the answer book is treated as unfair means.
  quote: The answer books of the term-end examinations will be QR coded
- id: F0033
  source: SRC052
  page: 17
  sub_intent: EXAM_ELIGIBILITY
  department: Examination department
  fact: If the term is not granted for attendance shortfall, any appearance in the term-end exam is treated as null and void.
  quote: his/her appearance will be treated as null and void
- id: F0034
  source: SRC052
  page: 17
  sub_intent: SCRIBE_WRITER
  department: Dean / Director; Examination section
  fact: A student with a permanent or temporary disability applies for a scribe with a medical certificate from a Registered Medical Practitioner (Annexure 6), approved by the school Dean/Director before it goes to the examination section.
  quote: The application should be approved by the respective school Dean/Director before forwarding to the examination section
  documents:
  - Scribe application (Annexure 6)
  - Medical certificate from a Registered Medical Practitioner
- id: F0035
  source: SRC052
  page: 17
  sub_intent: SCRIBE_WRITER
  department: Examination office
  fact: The student arranges the scribe at least one week before the exam and informs the examination office; the scribe should be one grade junior if from the same stream.
  quote: at least one week before the examination and inform to the examination office
- id: F0036
  source: SRC052
  page: 17
  sub_intent: SCRIBE_WRITER
  department: Examination department
  fact: Students using a scribe get 20 minutes per hour of compensatory time (40 minutes for a two-hour paper).
  quote: compensatory time of 20 minutes per hour will be allowed
- id: F0037
  source: SRC052
  page: 18
  sub_intent: SCRIBE_WRITER
  department: Admission department
  fact: For learning disabilities on the Mumbai campus, only certificates from Sion Hospital or Nair Hospital are accepted, submitted at the start of the academic year.
  quote: For Mumbai campus medical certificate from Sion Hospital / Nair Hospital only would be accepted
- id: F0038
  source: SRC052
  page: 18
  sub_intent: EXAM_MISCONDUCT
  department: Unfair Means Inquiry Committee
  fact: In a suspected unfair-means case the student gets a show cause notice, appears before the Unfair Means Inquiry Committee, and the result is withheld until the inquiry concludes.
  quote: The student’s examination result shall be withheld, until the inquiry proceedings are concluded
- id: F0039
  source: SRC052
  page: 18
  sub_intent: EXAM_MISCONDUCT
  department: Examination department
  fact: Possessing an electronic device such as a mobile phone or smart watch in the exam hall leads to annulment of performance at the examination in full.
  quote: Annulment of the performance of the student at the University Examination in full
- id: F0040
  source: SRC052
  page: 21
  sub_intent: EXAM_GRIEVANCE
  department: Examination department
  fact: The grievance redressal mechanism applies only to term-end examinations, not to practicals, labs, viva, projects, online MCQs, assignments or dissertations.
  quote: The Grievance Redressal Mechanism will apply only to the ‘term-end Examinations’ of the University
- id: F0041
  source: SRC052
  page: 21
  sub_intent: REVALUATION
  department: Examination department
  fact: Grievance applications are made online only through the Student Portal (Result Portal – SAP); offline applications are not considered.
  quote: The application for Redressal of Grievance can be made online only through the Student Portal (Result Portal – SAP)
- id: F0042
  source: SRC052
  page: 21
  sub_intent: MARK_VERIFICATION
  department: Examination department
  fact: Verification (retotalling) checks that all answers are evaluated, marks carried forward and totalled correctly; it must be applied for within 3 days of result declaration including holidays.
  quote: Within 3 days from the date of result declaration
- id: F0043
  source: SRC052
  page: 21
  sub_intent: ANSWER_BOOK_COPY
  department: Examination department
  fact: A photocopy/soft copy of the answer script must be applied for within 2 days of result declaration including holidays; it becomes available on the student portal on submission.
  quote: Within 2 days from the date of result declaration
- id: F0044
  source: SRC052
  page: 21
  sub_intent: REVALUATION
  department: Examination department
  fact: Students cannot apply for revaluation without first applying for a photocopy of the answer script.
  quote: Students will not be eligible to apply for revaluation if they do not apply for a Photocopy(ies) of their answer script/s
- id: F0045
  source: SRC052
  page: 21
  sub_intent: REVALUATION
  department: Examination department
  fact: The revaluation application must name the specific questions and clear reasons; otherwise it is not re-evaluated and the fee is not refunded. Only challenged answers are reviewed.
  quote: Answer books/Answer Scripts will not be reevaluated in case student does not provide clear and specific reasons
- id: F0046
  source: SRC052
  page: 22
  sub_intent: REVALUATION
  department: Examination department
  fact: Revaluation applications are due within 3 days of result declaration (in the example, by 16.00 hrs); late applications are not entertained.
  quote: No application, received after the prescribed number of days as mentioned in the table above, shall be entertained
- id: F0047
  source: SRC052
  page: 22
  sub_intent: REVALUATION
  department: Controller of Examinations
  fact: If revaluation changes marks by 20% or less, the revalued marks are final; above 20%, a second revaluation is done and the better of the two counts. Marks may go up or down.
  quote: Second revaluation of the said answer book shall be done by the examiners/subject experts from approved panel
- id: F0048
  source: SRC052
  page: 23
  sub_intent: REVALUATION
  department: Examination department
  fact: The whole grievance redressal process is completed within 15 working days of the application; photocopies of re-evaluated answer books are not given.
  quote: shall be completed within a period of 15 working days
- id: F0049
  source: SRC052
  page: 23
  sub_intent: EXAM_RESULT
  department: Examination department
  fact: Grace marks of up to 2% of aggregate (max 6 overall, at most 3% of a subject's maximum) may be given to a candidate failing one or more subjects, on the term-end component only.
  quote: grace marks up to 2 per cent of the marks on the aggregate
- id: F0050
  source: SRC052
  page: 23
  sub_intent: STATEMENT_OF_MARKS
  department: Examination department
  fact: All students receive a Statement of Grades on completing each academic year; re-issue because of personal-detail changes after the first year attracts charges.
  quote: All students shall receive a Statement of Grades upon com pletion of each academic year
- id: F0051
  source: SRC052
  page: 23
  sub_intent: ACADEMIC_GUIDELINES
  department: Examination department
  fact: Students with F grades, ATKT, unfair means or misconduct are not eligible for the rank holder list or the Dean's/Director's list (top 10% by CGPA).
  quote: Students obtaining F grades/ATKT/ involved in unfair means or any misconduct will be ineligible
- id: F0052
  source: SRC052
  page: 24
  sub_intent: SCHOLARSHIP_ELIGIBILITY
  department: Academic office
  fact: Students with an F in any subject, a misconduct record or low attendance are automatically disqualified from the awards process.
  quote: will be automatically disqualified from the awards process
- id: F0053
  source: SRC052
  page: 24
  sub_intent: SCHOLARSHIP_APPLICATION
  department: Academic office
  fact: NMIMS students can apply for national scholarships through the National Scholarship Portal (NSP), e.g. the Central Sector Scheme and minority scholarship schemes.
  quote: The students of SVKM’s NMIMS can avail national scholarship through the National Scholarship Portal (NSP)
- id: F0054
  source: SRC052
  page: 24
  sub_intent: SCHOLARSHIP_APPLICATION
  department: Academic office
  fact: Other NSP schemes such as AICTE Pragati Scholarship for Girl Students (technical degrees) are available depending on eligibility.
  quote: AICTE – Pragati Scholarship Scheme for Girl Students
- id: F0055
  source: SRC052
  page: 24
  sub_intent: SCHOLARSHIP_APPLICATION
  department: Academic office
