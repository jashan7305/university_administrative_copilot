# Hand-annotated gold NER test set (Week 4). 120 queries from the TEST split (60 core from official NMIMS sources, 60 rule-generated
# variants incl. typos), sampled with a fixed seed and annotated manually by the team - NOT produced by the rule
# labeller. Used to compare rule-based, CRF and transformer NER fairly.
#
# Guideline (same schema as data/final/nmims_ner_annotations.csv):
#   CERTIFICATE  certificate-type outputs: bonafide, migration/clearance/no-dues, LOR, percentage letter, degree certificate
#   DOCUMENT     other documents/forms/IDs: id card, fee receipt, marksheet, grade sheet, transcript, answer book,
#                indemnity bond, application/form names, passport, aadhaar, degree (as a document)
#   EXAMINATION  exam, re-exam, TEE, lab exam, mid term test / MTT, end semester examinations
#   ACTION       procedure the user wants: revaluation, renew, cancellation, correction, apply, photocopy, deferment,
#                academic break, night out, readmission, appeal, refund, registration, log in, issue (books)
#   ISSUE        problem described: lost, stolen, late, error, detained, short attendance, ragging, missed, accident,
#                hospitalised, not working
#   DEPARTMENT   offices / roles / committees: library, exam dept, dean, counsellor, ombudsman, registrar, committees,
#                admission (dept), anti ragging squad
#   ORGANIZATION systems and outside bodies: student portal, SAP, WES, National Academic Depository, NCDOE
#   FEE, SCHOLARSHIP, PROGRAM, SEMESTER, DATE, DEADLINE, PERCENTAGE, GRADE, CGPA, PURPOSE, SCHOOL, UNIVERSITY,
#   LOCATION, CAMPUS, HOSTEL, STUDENT_NUMBER as in the schema. Typos are annotated on the misspelled span.
# Format: query_id: [[exact span as it appears in the query, TYPE], ...]  (empty list = no entities)
