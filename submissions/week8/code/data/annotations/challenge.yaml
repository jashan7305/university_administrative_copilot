# Week 5 challenge test set: hard queries built from official NMIMS sources to probe known weak spots of the copilot.
# Not used for training or model selection. Labels:
#   intent / sub: gold label; a list means any of the listed labels is acceptable (ambiguous or multi-intent)
#   sub: null = only the intent is scored
#   cat: the stress category the query belongs to
challenge:
  # ---------------------------------------------------------------- near-domain out-of-scope (university-ish, but not NMIMS admin)
