[project]
name = "backend"
version = "0.1.0"
description = "Backend and NLP components for the University Administrative Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "nltk>=3.10.3",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sklearn-crfsuite>=0.5.0",
    "rank-bm25>=0.2.2",
    "seqeval>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
llm = ["anthropic"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
